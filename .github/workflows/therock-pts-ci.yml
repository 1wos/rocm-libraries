name: Performance Test Suite

on:
  push:
    branches:
      - users/madkasul/pts
  workflow_call:
    inputs:
      artifact_run_id:
        type: string
      amdgpu_family:
        type: string
      test_runs_on:
        type: string
      rocrand:
        type: boolean
  workflow_dispatch:
    inputs:
      artifact_run_id:
        type: string
        description: "Enabled to pull Linux artifacts using artifact_run_id"
        default: ""
      amdgpu_family:
        type: string
        description: 'The AMD GPU family to test. ex: gfx94X, gfx120X'
        default: "gfx94X"
      test_runs_on:
        type: string
        description: "Enabled to choose the Test Target"
        default: "linux-gfx942-1gpu-css-ossci-rocm"
      rocrand:
        type: boolean
        description: "Test rocrand"
        default: true

permissions:
  contents: read

jobs:
  setup_matrix:
    name: Setup test matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set_matrix.outputs.matrix }}
    steps:
      - name: Build component matrix from inputs
        id: set_matrix
        run: |
          components=()
          # For push events, default to testing all components
          if [[ "${{ github.event_name }}" == "push" ]] || [[ "${{ inputs.rocrand }}" == "true" ]]; then
            components+=("rocrand")
          fi
          if [ ${#components[@]} -eq 0 ]; then
            echo "Error: No components selected"
            exit 1
          fi
          JSON_ARRAY=$(printf '%s\n' "${components[@]}" | jq -R . | jq -sc .)
          echo "matrix=$JSON_ARRAY" >> $GITHUB_OUTPUT
          echo "Selected components: ${components[*]}"
  test_component:
    name: 'PTS - ${{ matrix.component }}'
    needs: setup_matrix
    runs-on: ${{ inputs.test_runs_on || 'linux-gfx942-1gpu-ccs-ossci-rocm' }}
    timeout-minutes: 210
    container:
      image: ${{ 'ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98' || null }}
      options: --ipc host
        --group-add video
        --device /dev/kfd
        --device /dev/dri
        --group-add 993
        --group-add 992
        --group-add 110
        --env-file /etc/podinfo/gha-gpu-isolation-settings
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.setup_matrix.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          ref: b68757b3461145b85eabec29cea1223027a56da0 # 2026-04-01

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.12

      - name: Install TheRock
        run: |
          pip install -r requirements-test.txt
          python3 build_tools/install_rocm_from_artifacts.py --tests --amdgpu-family ${{ inputs.amdgpu_family || 'gfx94X' }} --latest-release

      - name: Checkout rocm-libraries repository for scripts
        uses: actions/checkout@v4
        with:
          path: rocm-libraries

      - name: Test
        env:
          COMMIT_ID: ${{ github.sha }}
          CURRENT_BRANCH: ${{ github.ref_name }}
          PTS_DB_API_ID: ${{ secrets.PTS_DB_API_ID }}
          PTS_DB_API_KEY: ${{ secrets.PTS_DB_API_KEY }}
        run: |
          pip3 install --requirement rocm-libraries/test/pts/requirements.txt
          python3 -m pytest -s -v --tb=short --rock-dir=./therock-build rocm-libraries/test/pts/tests_pts.py --push-db -k ${{ matrix.component }}
